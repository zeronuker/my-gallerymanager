name: Build APK

on:
  workflow_dispatch:      # manual run: debug APK as a downloadable artifact
    inputs:
      name:
        description: 'Name for the APK (e.g. phase-2)'
        required: false
        default: 'debug'
  push:
    branches: ['feature/**']   # compile check + debug APK on every push to a feature branch
    tags: ['v*']          # tag push: signed release APK attached to a GitHub Release

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode keystore
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle ${{ env.IS_RELEASE == 'true' && 'assembleRelease' || 'assembleDebug' }} --no-daemon

      - name: Name the APK
        if: env.IS_RELEASE != 'true'
        run: mv app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/gallerymanager-${{ inputs.name || 'debug' }}.apk"

      - name: Upload debug APK
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gallerymanager-${{ inputs.name || 'debug' }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
