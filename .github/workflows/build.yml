name: Build APK

# Every push to main builds a signed release APK and publishes it as a GitHub Release.
# The app checks the newest release at start and offers it as an update (see data/Updater.kt).
on:
  push:
    branches: [main]
  workflow_dispatch:      # run again without a new commit

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # versionCode must rise with every build or Android refuses the update; the run number only ever goes up.
      # The +100 keeps it above the 11 that is committed for local builds.
      - name: Version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=$VERSION_CODE --no-daemon

      # the file name carries the version code: the app reads it from there
      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk "gallerymanager-$VERSION_CODE.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VERSION_CODE }}
          name: Build ${{ env.VERSION_CODE }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: gallerymanager-${{ env.VERSION_CODE }}.apk
